[project]
name = "grupo-mexico-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "claude-agent-sdk>=0.2.165",
    "deepeval>=2.9.3",
    "dotenv>=0.9.9",
    "easyocr>=1.7.2",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "tiktoken>=0.14.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[project.scripts]
grupo-mexico-evals = "grupo_mexico_evals.pipeline:main"
rag-agent = "grupo_mexico_evals.agent:cli"
rag-benchmark = "grupo_mexico_evals.benchmark:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grupo_mexico_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["eval: paid LLM evals, skipped unless selected with -m eval"]
addopts = "-m 'not eval'"

[tool.uv]
# deepeval 2.9.3 pins anthropic<0.50, which blocks langchain-anthropic
override-dependencies = ["anthropic>=0.50"]
